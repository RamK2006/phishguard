<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400, height=600">
  <title>PhishGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 400px;
      height: 600px;
      background: #0A0E1A;
      color: #E2E8F0;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-y: auto;
    }

    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(99, 102, 241, 0.15);
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header .subtitle {
      font-size: 11px;
      color: #64748B;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Risk Gauge */
    .gauge-container {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gauge-svg {
      width: 180px;
      height: 100px;
    }

    .gauge-label {
      font-size: 12px;
      color: #94A3B8;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .gauge-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      margin-top: 4px;
    }

    .risk-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 8px;
    }

    .risk-safe { background: rgba(34, 197, 94, 0.15); color: #22C55E; border: 1px solid rgba(34, 197, 94, 0.3); }
    .risk-suspicious { background: rgba(245, 158, 11, 0.15); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.3); }
    .risk-malicious { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* Recent Scans */
    .section-title {
      padding: 12px 20px 8px;
      font-size: 11px;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .scan-list {
      padding: 0 16px 16px;
    }

    .scan-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.1);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      transition: all 0.15s;
    }

    .scan-item:hover {
      border-color: rgba(99, 102, 241, 0.3);
      transform: scale(1.01);
    }

    .scan-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94A3B8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scan-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .scan-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
    }

    .scan-time {
      font-size: 10px;
      color: #475569;
    }

    /* Controls */
    .controls {
      padding: 12px 20px;
      border-top: 1px solid rgba(99, 102, 241, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle {
      width: 40px;
      height: 22px;
      background: #1E293B;
      border-radius: 11px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .toggle.active { background: rgba(99, 102, 241, 0.3); }

    .toggle::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: #6366F1;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
    }

    .toggle.active::after { transform: translateX(18px); }

    .toggle-label {
      font-size: 12px;
      color: #94A3B8;
    }

    .dashboard-link {
      font-size: 12px;
      color: #6366F1;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    .dashboard-link:hover { opacity: 0.8; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #475569;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #64748B;
    }

    @keyframes shimmer {
      0% { background-position: -200px 0; }
      100% { background-position: 200px 0; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡 PhishGuard</h1>
    <div class="subtitle">AI-Powered Phishing Protection</div>
  </div>

  <div class="gauge-container" id="gaugeContainer">
    <div class="loading">Scanning current page...</div>
  </div>

  <div class="section-title">Recent Scans</div>
  <div class="scan-list" id="scanList">
    <div class="loading">Loading...</div>
  </div>

  <div class="controls">
    <div class="toggle-container">
      <div class="toggle active" id="scanToggle"></div>
      <span class="toggle-label">Protection Active</span>
    </div>
    <a href="http://localhost:3000" target="_blank" class="dashboard-link">
      Open Dashboard →
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
